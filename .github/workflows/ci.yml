name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Package tests on macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show the Xcode version
        run: xcodebuild -version
      - name: Run the tests
        run: swift test

  build-ios:
    name: iOS builds
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show the Xcode version
        run: xcodebuild -version
      - name: Build the package
        run: >
          xcodebuild build -scheme TranscriptKit -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
      - name: Build the demo app
        run: >
          xcodebuild build -project Demo/TranscriptDemo.xcodeproj -scheme TranscriptDemo
          -destination 'generic/platform=iOS' -skipMacroValidation CODE_SIGNING_ALLOWED=NO
      - name: Build the chat sample
        run: >
          xcodebuild build -project Examples/ChatSample/ChatSample.xcodeproj -scheme ChatSample
          -destination 'generic/platform=iOS' -skipMacroValidation CODE_SIGNING_ALLOWED=NO
      - name: Build the benchmark app
        run: >
          xcodebuild build -project Benchmark/TranscriptBench.xcodeproj -scheme TranscriptBench
          -destination 'generic/platform=iOS' -skipMacroValidation CODE_SIGNING_ALLOWED=NO

  ios-view-tests:
    name: iOS view tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Show the Xcode version
        run: xcodebuild -version
      - name: Pick a simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(part) for part in runtime.rsplit("iOS-", 1)[1].split("-")]
          runtimes = sorted((r for r in devices if ".SimRuntime.iOS-" in r), key=version, reverse=True)
          phones = [(r, d) for r in runtimes for d in devices[r] if ".iPhone-" in d["deviceTypeIdentifier"]]
          if not phones:
              sys.exit("No iPhone simulator is available.")
          runtime, device = phones[0]
          print(device["name"], runtime, file=sys.stderr)
          print(device["udid"])
          ')
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: Run the view tests
        run: >
          xcodebuild test -scheme TranscriptKit
          -destination "platform=iOS Simulator,id=$SIMULATOR_UDID"
          -only-testing:TranscriptKitViewTests
